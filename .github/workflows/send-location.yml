name: ส่งโลเคชั่นเข้า LINE ตอน 9 โมง

on:
  schedule:
    # cron เป็นเวลา UTC เสมอ — 09:00 เวลาไทย (ICT, UTC+7) = 02:00 UTC
    - cron: "0 2 * * *"
  # กดรันเองได้จากแท็บ Actions เพื่อทดสอบ
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ส่งโลเคชั่นเข้า LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          # ปรับข้อความทักทายได้ที่นี่ หรือเอาออกถ้าไม่ต้องการ
          LOCATION_GREETING: "🌅 อรุณสวัสดิ์! ตำแหน่งล่าสุดวันนี้"
        run: npm run send
